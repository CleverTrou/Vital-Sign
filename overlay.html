<!--
  Vital Sign overlay: OBS Browser Source that renders live heart rate + SpO2.

  Load this as a "Local file" browser source in OBS (see README). It has no
  build step and makes no external network requests -- it only opens a
  WebSocket back to bridge.py on localhost, which is the only thing it needs.

  A generic file:// page would send `Origin: null` on the WebSocket
  handshake, but OBS's embedded CEF browser sends `http://absolute` instead
  for local-file browser sources specifically (confirmed against a real OBS
  instance). bridge.py's allowlist expects both -- see ALLOWED_ORIGINS
  there. If you ever serve this over HTTP instead of as a local file, or
  hit new rejections in bridge.log after an OBS update changes this again,
  you'll need to add that origin to bridge.py too.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vital Sign Overlay</title>
<style>
  :root {
    --hr-color: #ff4d6d;
    --spo2-good: #4ade80;
    --spo2-warn: #facc15;
    --spo2-bad: #f87171;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent; /* OBS composites this straight over your scene */
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .panel {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 18px 32px;
    border-radius: 20px;
    background: rgba(10, 12, 16, 0.55);
    backdrop-filter: blur(6px);
    color: #f5f5f7;
    transition: opacity 0.4s ease;
  }
  /* Dims the whole panel rather than freezing it silently on a last-good
     reading, so a stalled bridge/BLE link is visually obvious on stream. */
  .panel.stale { opacity: 0.35; }

  .metric { display: flex; align-items: baseline; gap: 10px; }

  .hr-icon {
    width: 40px;
    height: 40px;
    fill: var(--hr-color);
    transform-origin: center;
    animation: beat 1s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }
  /* Viewers with vestibular disorders can opt out of motion at the OS
     level; honor that instead of forcing the pulse animation on everyone. */
  @media (prefers-reduced-motion: reduce) {
    .hr-icon { animation: none; }
  }

  .value {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 18px; opacity: 0.7; font-weight: 500; }

  .spo2-value {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease;
  }
  /* Color-coded severity below is a convenience, not the only signal --
     applyReading() also adds a text marker and toggles .spo2-warn/.spo2-bad
     (bold + underline) so the state doesn't depend on color perception. */
  .spo2-value.spo2-warn,
  .spo2-value.spo2-bad {
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .spo2-marker {
    font-size: 22px;
    margin-left: 2px;
    vertical-align: super;
  }

  .divider { width: 1px; height: 48px; background: rgba(255, 255, 255, 0.2); }

  .status {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #ccc;
    opacity: 0.8;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 10px;
    border-radius: 8px;
    display: none;
  }
  .status.visible { display: block; }
</style>
</head>
<body>
  <!--
    aria-live regions + labels are here for the case where someone opens
    this file directly in a normal browser tab (e.g. while styling it) --
    OBS itself renders to video, which assistive tech can't read regardless.
  -->
  <div class="panel" id="panel">
    <div class="metric" role="group" aria-label="Heart rate">
      <svg class="hr-icon" id="hrIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 21s-7.5-4.6-10-9.1C.3 8.6 1.7 4.9 5.2 4.1 7.5 3.6 9.8 4.6 12 7c2.2-2.4 4.5-3.4 6.8-2.9 3.5.8 4.9 4.5 3.2 7.8-2.5 4.5-10 9.1-10 9.1z"/>
      </svg>
      <span class="value" id="hrValue" aria-live="polite">--</span>
      <span class="unit">bpm</span>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="metric" role="group" aria-label="Blood oxygen saturation">
      <span class="spo2-value" id="spo2Value" aria-live="polite">--</span>
      <span class="unit">SpO&#8322;</span>
    </div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>

<script>
  // Must match bridge.py's --ws-port / config.sh's WS_PORT (both default
  // to 8765). If you change one, change this too.
  const WS_URL = "ws://localhost:8765";

  const panel = document.getElementById("panel");
  const hrValue = document.getElementById("hrValue");
  const hrIcon = document.getElementById("hrIcon");
  const spo2Value = document.getElementById("spo2Value");
  const statusEl = document.getElementById("status");

  // If no message arrives for this long, treat the data as stale (ring
  // off/BLE dropped/bridge crashed) rather than keep showing a frozen
  // last-good number as if it were still live.
  const STALE_MS = 8000;
  let staleTimer = null;

  function setStatus(text) {
    if (text) {
      statusEl.textContent = text;
      statusEl.classList.add("visible");
    } else {
      statusEl.classList.remove("visible");
    }
  }

  function markStale(isStale) {
    panel.classList.toggle("stale", isStale);
  }

  function resetStaleTimer() {
    markStale(false);
    if (staleTimer) clearTimeout(staleTimer);
    staleTimer = setTimeout(() => markStale(true), STALE_MS);
  }

  // Returns both a CSS color and a short text/symbol marker, so severity
  // never depends on color alone (WCAG 1.4.1) -- useful for colorblind
  // viewers and for anyone glancing at a compressed stream where the color
  // channel is the first thing to degrade.
  function spo2Severity(spo2) {
    if (spo2 >= 95) return { css: "var(--spo2-good)", cls: null, marker: "" };
    if (spo2 >= 90) return { css: "var(--spo2-warn)", cls: "spo2-warn", marker: "▲" };
    return { css: "var(--spo2-bad)", cls: "spo2-bad", marker: "⚠" };
  }

  function applyReading(msg) {
    resetStaleTimer();

    if (!msg.worn) {
      setStatus("Not worn");
      hrValue.textContent = "--";
      spo2Value.textContent = "--";
      return;
    }
    if (msg.calibrating) {
      setStatus("Calibrating…");
      hrValue.textContent = "--";
      spo2Value.textContent = "--";
      return;
    }

    setStatus(null);
    hrValue.textContent = msg.hr;

    const severity = spo2Severity(msg.spo2);
    spo2Value.textContent = msg.spo2 + "%" + (severity.marker ? " " + severity.marker : "");
    spo2Value.style.color = severity.css;
    spo2Value.classList.toggle("spo2-warn", severity.cls === "spo2-warn");
    spo2Value.classList.toggle("spo2-bad", severity.cls === "spo2-bad");

    if (msg.hr > 0) {
      hrIcon.style.animationDuration = (60 / msg.hr) + "s";
    }
  }

  function applyState(msg) {
    if (msg.state === "connecting") {
      setStatus("Connecting to ring…");
    } else if (msg.state === "disconnected") {
      setStatus("Disconnected");
      markStale(true);
    } else if (msg.state === "idle") {
      setStatus("Idle");
      markStale(true);
    }
    // "connected": leave status as-is until the first reading arrives.
  }

  function connect() {
    const ws = new WebSocket(WS_URL);
    ws.onopen = () => setStatus("Waiting for device…");
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "reading") applyReading(msg);
      else if (msg.type === "state") applyState(msg);
    };
    ws.onclose = () => {
      setStatus("Bridge offline — retrying…");
      markStale(true);
      setTimeout(connect, 2000); // bridge.py may still be starting up
    };
    ws.onerror = () => ws.close(); // triggers onclose's retry above
  }

  connect();
</script>
</body>
</html>
