<!--
  Vital Sign overlay: OBS Browser Source that renders live heart rate + SpO2.

  Load this as a "Local file" browser source in OBS (see README). It has no
  build step and makes no external network requests -- it only opens a
  WebSocket back to bridge.py on localhost, which is the only thing it needs.

  A generic file:// page would send `Origin: null` on the WebSocket
  handshake, but OBS's embedded CEF browser sends `http://absolute` instead
  for local-file browser sources specifically (confirmed against a real OBS
  instance). bridge.py's allowlist expects both -- see ALLOWED_ORIGINS
  there. If you ever serve this over HTTP instead of as a local file, or
  hit new rejections in bridge.log after an OBS update changes this again,
  you'll need to add that origin to bridge.py too.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vital Sign Overlay</title>
<style>
  :root {
    --hr-color: #ff4d6d;
    --spo2-good: #4ade80;
    --spo2-warn: #facc15;
    --spo2-bad: #f87171;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent; /* OBS composites this straight over your scene */
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    /* flex-start, not center: if the panel's natural content (heart + both
       numbers) is ever wider than the OBS Browser Source box you picked,
       overflow only clips the low-priority right side (the "SpO2" unit
       label). "center" clipped the heart too -- confirmed the panel's
       natural width (~485-525px depending on digit count) exceeds a
       400px box, and different browser engines split that overflow
       differently: recent desktop Chrome safely falls back to flush-left,
       but OBS's embedded CEF browser clipped both edges symmetrically,
       cutting into the heart. flex-start is deterministic across engines. */
    justify-content: flex-start;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 18px 32px;
    border-radius: 20px;
    background: rgba(10, 12, 16, 0.55);
    backdrop-filter: blur(6px);
    color: #f5f5f7;
    transition: opacity 0.4s ease;
  }
  /* Dims the whole panel rather than freezing it silently on a last-good
     reading, so a stalled bridge/BLE link is visually obvious on stream. */
  .panel.stale { opacity: 0.35; }

  .metrics-row { display: flex; align-items: center; gap: 28px; }
  .metric { display: flex; align-items: baseline; gap: 10px; }

  .hr-icon {
    width: 40px;
    height: 40px;
    fill: var(--hr-color);
    transform-origin: center;
    animation: beat 1s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }
  /* Viewers with vestibular disorders can opt out of motion at the OS
     level; honor that instead of forcing the pulse animation on everyone. */
  @media (prefers-reduced-motion: reduce) {
    .hr-icon { animation: none; }
  }

  .value {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 18px; opacity: 0.7; font-weight: 500; }

  .spo2-value {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease;
  }
  /* Color-coded severity is a convenience, not the only signal -- the
     marker span below carries the same information as a shape, so it
     doesn't depend on color perception (WCAG 1.4.1). Sized/positioned as
     a small badge rather than inline text so it reads as an indicator,
     not as more digits glued onto the number. */
  .spo2-marker {
    font-size: 20px;
    font-weight: 700;
    margin-left: 3px;
    vertical-align: super;
  }

  .divider { width: 1px; height: 48px; background: rgba(255, 255, 255, 0.2); }

  /* BPM trend sparkline -- last 5 minutes. Single series, so per the
     dataviz style guide: reuse --hr-color rather than a new palette, no
     legend/axis/gridlines (the big number above already labels it), 2px
     line with a ~10% wash beneath it, one end-dot marking "now". No
     hover/tooltip layer either -- this renders into OBS's video output,
     which no pointer ever reaches; a hover affordance would only matter
     for the secondary case of opening this file directly in a browser,
     which isn't worth the complexity here. */
  .trend-row { height: 44px; }
  .hr-trend { width: 100%; height: 100%; display: block; overflow: visible; }
  .hr-trend-area { fill: var(--hr-color); opacity: 0.12; stroke: none; }
  .hr-trend-line {
    fill: none;
    stroke: var(--hr-color);
    stroke-width: 2;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .hr-trend-dot {
    fill: var(--hr-color);
    stroke: rgb(18, 20, 24); /* approximates the panel's own surface color, since it sits under a semi-transparent+blur background rather than a flat one */
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .status {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #ccc;
    opacity: 0.8;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 10px;
    border-radius: 8px;
    display: none;
  }
  .status.visible { display: block; }
</style>
</head>
<body>
  <!--
    aria-live regions + labels are here for the case where someone opens
    this file directly in a normal browser tab (e.g. while styling it) --
    OBS itself renders to video, which assistive tech can't read regardless.
  -->
  <div class="panel" id="panel">
    <div class="metrics-row">
      <div class="metric" role="group" aria-label="Heart rate">
        <svg class="hr-icon" id="hrIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 21s-7.5-4.6-10-9.1C.3 8.6 1.7 4.9 5.2 4.1 7.5 3.6 9.8 4.6 12 7c2.2-2.4 4.5-3.4 6.8-2.9 3.5.8 4.9 4.5 3.2 7.8-2.5 4.5-10 9.1-10 9.1z"/>
        </svg>
        <span class="value" id="hrValue" aria-live="polite">--</span>
        <span class="unit">bpm</span>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="metric" role="group" aria-label="Blood oxygen saturation">
        <span class="spo2-value" id="spo2Value" aria-live="polite" aria-atomic="true"><span id="spo2Number">--</span><span class="spo2-marker" id="spo2Marker" aria-hidden="true"></span></span>
        <span class="unit">SpO&#8322;</span>
      </div>
    </div>
    <div class="trend-row">
      <svg class="hr-trend" id="hrTrend" aria-hidden="true" focusable="false">
        <path class="hr-trend-area" id="hrTrendArea"></path>
        <polyline class="hr-trend-line" id="hrTrendLine"></polyline>
        <circle class="hr-trend-dot" id="hrTrendDot" r="4" visibility="hidden"></circle>
      </svg>
    </div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>

<script>
  // Must match bridge.py's --ws-port / config.sh's WS_PORT (both default
  // to 8765). If you change one, change this too.
  const WS_URL = "ws://localhost:8765";

  const panel = document.getElementById("panel");
  const hrValue = document.getElementById("hrValue");
  const hrIcon = document.getElementById("hrIcon");
  const spo2Value = document.getElementById("spo2Value");
  const spo2Number = document.getElementById("spo2Number");
  const spo2Marker = document.getElementById("spo2Marker");
  const statusEl = document.getElementById("status");
  const hrTrend = document.getElementById("hrTrend");
  const hrTrendArea = document.getElementById("hrTrendArea");
  const hrTrendLine = document.getElementById("hrTrendLine");
  const hrTrendDot = document.getElementById("hrTrendDot");

  // If no message arrives for this long, treat the data as stale (ring
  // off/BLE dropped/bridge crashed) rather than keep showing a frozen
  // last-good number as if it were still live.
  const STALE_MS = 8000;
  let staleTimer = null;

  function setStatus(text) {
    if (text) {
      statusEl.textContent = text;
      statusEl.classList.add("visible");
    } else {
      statusEl.classList.remove("visible");
    }
  }

  function markStale(isStale) {
    panel.classList.toggle("stale", isStale);
  }

  function resetStaleTimer() {
    markStale(false);
    if (staleTimer) clearTimeout(staleTimer);
    staleTimer = setTimeout(() => markStale(true), STALE_MS);
  }

  // Returns a CSS color, a short visual symbol marker, and a text label --
  // severity never depends on color alone (WCAG 1.4.1). The marker is
  // aria-hidden (a screen reader spelling out "triangle" or "warning sign"
  // isn't useful), so `label` is what conveys the same severity in speech;
  // sighted colorblind viewers get the marker, screen reader users get the
  // label via spo2Value's aria-label.
  function spo2Severity(spo2) {
    if (spo2 >= 95) return { css: "var(--spo2-good)", marker: "", label: "normal" };
    if (spo2 >= 90) return { css: "var(--spo2-warn)", marker: "▲", label: "low" };
    return { css: "var(--spo2-bad)", marker: "⚠︎", label: "very low" }; // ︎: force plain-text glyph, not the colored emoji variant
  }

  // BPM trend sparkline: last 5 minutes, entirely client-side. bridge.py
  // doesn't buffer history at all -- every reading it broadcasts already
  // reaches us over the same WebSocket, so there's nothing to add on that
  // end; we just keep the last 5 minutes' worth of {t, hr} pairs here and
  // redraw. A freshly (re)loaded overlay starts with an empty graph and
  // builds up over the next 5 minutes -- no history survives a reload,
  // which is fine for a stream overlay that's normally left running for
  // the whole session.
  const TREND_WINDOW_MS = 5 * 60 * 1000;
  const hrHistory = []; // [{t: epoch ms, hr: number}, ...] oldest first

  // Shared by recordHr (called on every new reading) and drawTrend (also
  // called on its own every 5s via setInterval, to age the window even
  // when no new readings are arriving -- e.g. ring off/bridge offline).
  // Both paths need to prune against the *current* time: pruning only in
  // recordHr would leave stale points sitting in hrHistory forever once
  // readings stop, and their x-positions (computed relative to "now")
  // would drift to increasingly wrong places instead of sliding off.
  function pruneHistory(now) {
    const cutoff = now - TREND_WINDOW_MS;
    while (hrHistory.length && hrHistory[0].t < cutoff) hrHistory.shift();
  }

  function recordHr(hr) {
    const now = Date.now();
    hrHistory.push({ t: now, hr });
    pruneHistory(now);
  }

  function resizeTrendViewBox() {
    if (!hrTrend) return; // trend-row markup removed -- see "Customizing the overlay" in the README
    // Map data straight to real pixel coordinates rather than an abstract
    // viewBox stretched with preserveAspectRatio -- simpler, and avoids
    // non-uniform scaling distorting the 2px stroke (vector-effect
    // guards against that too, belt and suspenders).
    const w = hrTrend.clientWidth || 1;
    const h = hrTrend.clientHeight || 1;
    hrTrend.setAttribute("viewBox", `0 0 ${w} ${h}`);
    drawTrend();
  }

  function drawTrend() {
    if (!hrTrend) return; // trend-row markup removed -- see "Customizing the overlay" in the README
    pruneHistory(Date.now());
    if (hrHistory.length < 2) {
      hrTrendLine.setAttribute("points", "");
      hrTrendArea.setAttribute("d", "");
      hrTrendDot.setAttribute("visibility", "hidden");
      return;
    }

    const w = hrTrend.clientWidth || 1;
    const h = hrTrend.clientHeight || 1;
    const pad = 4; // keep the line/dot from clipping at the very edge
    const now = Date.now();
    const oldestT = now - TREND_WINDOW_MS;
    const hrs = hrHistory.map((p) => p.hr);
    const minHr = Math.min(...hrs);
    const maxHr = Math.max(...hrs);
    // Flat readings (minHr === maxHr) would divide by zero below; treat
    // as a small fixed range so a dead-flat trend still draws a flat
    // line in the middle rather than NaN-ing out.
    const range = Math.max(maxHr - minHr, 1);

    const points = hrHistory.map((p) => {
      const x = pad + ((p.t - oldestT) / TREND_WINDOW_MS) * (w - pad * 2);
      const y = pad + (1 - (p.hr - minHr) / range) * (h - pad * 2);
      return [x, y];
    });

    hrTrendLine.setAttribute("points", points.map(([x, y]) => `${x},${y}`).join(" "));

    const [firstX] = points[0];
    const [lastX] = points[points.length - 1];
    const areaPath =
      `M${firstX},${h} ` +
      points.map(([x, y]) => `L${x},${y}`).join(" ") +
      ` L${lastX},${h} Z`;
    hrTrendArea.setAttribute("d", areaPath);

    const [dotX, dotY] = points[points.length - 1];
    hrTrendDot.setAttribute("cx", dotX);
    hrTrendDot.setAttribute("cy", dotY);
    hrTrendDot.setAttribute("visibility", "visible");
  }

  window.addEventListener("resize", resizeTrendViewBox);

  function applyReading(msg) {
    resetStaleTimer();

    if (!msg.worn) {
      setStatus("Not worn");
      hrValue.textContent = "--";
      spo2Number.textContent = "--";
      spo2Marker.textContent = "";
      spo2Value.style.color = ""; // don't let "--" inherit a stale severity color from the last real reading
      spo2Value.removeAttribute("aria-label");
      return;
    }
    if (msg.calibrating) {
      setStatus("Calibrating…");
      hrValue.textContent = "--";
      spo2Number.textContent = "--";
      spo2Marker.textContent = "";
      spo2Value.style.color = "";
      spo2Value.removeAttribute("aria-label");
      return;
    }

    setStatus(null);
    hrValue.textContent = msg.hr;
    recordHr(msg.hr);
    drawTrend();

    const severity = spo2Severity(msg.spo2);
    spo2Number.textContent = msg.spo2 + "%";
    spo2Marker.textContent = severity.marker;
    spo2Value.style.color = severity.css; // inherited by both child spans
    spo2Value.setAttribute("aria-label", `${msg.spo2} percent, ${severity.label}`);

    if (msg.hr > 0) {
      hrIcon.style.animationDuration = (60 / msg.hr) + "s";
    }
  }

  function applyState(msg) {
    if (msg.state === "connecting") {
      setStatus("Connecting to ring…");
    } else if (msg.state === "disconnected") {
      setStatus("Disconnected");
      markStale(true);
    } else if (msg.state === "idle") {
      setStatus("Idle");
      markStale(true);
    }
    // "connected": leave status as-is until the first reading arrives.
  }

  function connect() {
    const ws = new WebSocket(WS_URL);
    ws.onopen = () => setStatus("Waiting for device…");
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "reading") applyReading(msg);
      else if (msg.type === "state") applyState(msg);
    };
    ws.onclose = () => {
      setStatus("Bridge offline — retrying…");
      markStale(true);
      setTimeout(connect, 2000); // bridge.py may still be starting up
    };
    ws.onerror = () => ws.close(); // triggers onclose's retry above
  }

  resizeTrendViewBox(); // establish the initial viewBox before any data arrives
  // Readings drive most redraws, but nothing else ages old points out of
  // the 5-minute window while the ring is off/disconnected -- without
  // this, the trend line would just freeze mid-shape instead of visibly
  // shrinking/scrolling as it goes stale.
  setInterval(drawTrend, 5000);
  connect();
</script>
</body>
</html>
